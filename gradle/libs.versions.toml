# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# Aligned with the IHMC stack (ihmc-avatar-interfaces declares mecano-graphviz 17-0.19.3), so
# that this project and `us.ihmc.alex.*` can share one classpath in the SCS2 avatar-sim track.
# 17-0.19.3 is not on Maven Central -- it comes from the IHMC repository declared in
# build.gradle.kts. The "17-" prefix is the Java 17 flavor.
mecano = "17-0.19.3"
# mecano 17-0.19.2 pulls euclid 0.22.3 transitively; pinned up to the latest 0.22.x patch.
euclid = "0.22.5"
# The version euclid and mecano both already resolve to. Declared explicitly because
# `registration` uses the SVD directly and must not depend on mecano to get it.
ejml = "0.39"
# scs2-definition is the headless half of SCS2: URDFTools, RobotDefinition, and
# RobotDefinition.newInstance() -> a Mecano RigidBodyBasics. It pulls no JavaFX. The visualizer
# (scs2-session-visualizer-jfx) is a separate artifact, used only by the `scs2` package.
#
# 17-0.33.2 rather than 17-0.30.0: ihmc-avatar-interfaces declares scs2-bullet-simulation
# 17-0.33.2, and the mocap ground-truth track runs inside that SCS2 avatar simulation. Two
# different SCS2 minor versions on one classpath is not a configuration anyone should debug, so
# this project follows the stack rather than the stack following it. Every SCS2 behaviour
# recorded in CLAUDE.md was verified against 17-0.30.0 and must be re-checked here -- notably
# the URDF mesh-resolution and null-geometry NPEs.
scs2 = "17-0.33.2"
junit = "5.10.2"

[libraries]
euclid = { module = "us.ihmc:euclid", version.ref = "euclid" }
euclid-frame = { module = "us.ihmc:euclid-frame", version.ref = "euclid" }
euclid-geometry = { module = "us.ihmc:euclid-geometry", version.ref = "euclid" }
mecano = { module = "us.ihmc:mecano", version.ref = "mecano" }
scs2-definition = { module = "us.ihmc:scs2-definition", version.ref = "scs2" }
# PR3 only, and only for the `scs2` package. Drags JavaFX 17.0.8 with it.
scs2-session-visualizer-jfx = { module = "us.ihmc:scs2-session-visualizer-jfx", version.ref = "scs2" }
# Live telemetry. Headless -- no JavaFX -- and already on the graph transitively via
# scs2-definition; declared explicitly because the `scs2` package uses YoVariable types directly.
ihmc-yovariables = { module = "us.ihmc:ihmc-yovariables", version = "0.13.6" }
ejml-core = { module = "org.ejml:ejml-core", version.ref = "ejml" }
ejml-ddense = { module = "org.ejml:ejml-ddense", version.ref = "ejml" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.10.2" }
