# Do NOT enable org.gradle.configuration-cache here. Buildship (used by jdtls/Eclipse to
# import this project) injects `apply plugin: "eclipse"` via an init script, and that
# plugin's GenerateEclipseClasspath task is not configuration-cache compatible. With the
# cache on, every IDE sync fails to produce a Java model and the LSP silently sees no
# source. Pass --configuration-cache explicitly on the CLI if you want it for a build.
org.gradle.caching=true

